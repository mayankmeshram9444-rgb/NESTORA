    <script>
      // Gracefully handle Vite HMR WebSocket closing in AI Studio preview iframe environment
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('WebSocket closed without opened') ||
           event.message.includes('WebSocket'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          String(event.reason?.message || event.reason).includes('WebSocket')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      const originalConsoleError = console.error;
      console.error = function (...args) {
        if (
          args[0] &&
          (String(args[0]?.message || args[0]).includes('WebSocket closed without opened') ||
           String(args[0]?.stack || '').includes('@vite/client'))
        ) {
          return;
        }
        originalConsoleError.apply(console, args);
      };
    </script>
